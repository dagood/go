# This template determines the correct pool and passes it into the provided
# inner stages template.
#
# Previously, this was a 3-file chain (pool.yml -> pool-1.yml -> pool-2.yml)
# because AzDO template expressions can't compute a value and reuse it later in
# the same file. pipelineymlgen lets us define expressions once as data
# variables and expand them in the generated output, so all the logic is here.

pipelineymlgen:
  output: self
  data:
    # Shorthand for AzDO expressions that are reused multiple times below.
    public: "eq(variables['System.TeamProject'], 'public')"
    servicing: "startsWith(variables['Build.SourceBranch'], 'refs/heads/microsoft/release-branch')"
    os: "parameters.inner.parameters.builder.os"
    hostArch: "parameters.inner.parameters.builder.hostArch"
    distro: "parameters.inner.parameters.builder.distro"
---

parameters:
  - name: ctx
    type: object

  # The inner template: { template string, parameters object }
  # Note: the template path is relative to this file (inside "stages/"), not the caller's file path.
  - name: inner
    type: object

stages:
  - template: ${{ parameters.inner.template }}
    parameters:
      ${{ insert }}: ${{ parameters.inner.parameters }}

      pool:
        # --- darwin: use Azure Pipelines hosted pool ---
        ${{ if eq(${ .os }, 'darwin') }}:
          name: Azure Pipelines
          # https://learn.microsoft.com/en-us/azure/devops/pipelines/agents/hosted?view=azure-devops&tabs=yaml#software
          ${{ if eq(${ .hostArch }, 'amd64') }}:
            vmImage: 'macos-14'
          ${{ else }}:
            vmImage: 'macos-15-arm64'
          os: macOS

        # --- linux ---
        ${{ elseif eq(${ .os }, 'linux') }}:
          # arm64 host: dedicated uniform pool, no demands needed.
          ${{ if eq(${ .hostArch }, 'arm64') }}:
            name: Docker-Linux-Arm-Internal
          # amd64 host: needs pool name and demands.
          ${{ else }}:
            # Pool name
            # https://github.com/dotnet/arcade/blob/0db07252ccb18afdf94820ba6125da6de729ec04/Documentation/AzureDevOps/AzureDevOpsOnboarding.md#agent-queues
            ${{ if ${ .public } }}:
              ${{ if ${ .servicing } }}:
                name: NetCore-Svc-Public
              ${{ else }}:
                name: NetCore-Public
            ${{ else }}:
              ${{ if ${ .servicing } }}:
                name: netcore1espool-svc-internal
              ${{ else }}:
                name: netcore1espool-internal
            # Pool image/demands
            ${{ if parameters.ctx['Go1ESOfficial'] }}:
              image: 1es-ubuntu-2204
              os: linux
            ${{ elseif ${ .public } }}:
              demands: ImageOverride -equals build.ubuntu.2204.amd64.open
            ${{ else }}:
              demands: ImageOverride -equals 1es-ubuntu-2204
              os: linux

        # --- windows (default) ---
        ${{ else }}:
          # Pool name
          ${{ if ${ .public } }}:
            ${{ if ${ .servicing } }}:
              name: NetCore-Svc-Public
            ${{ else }}:
              name: NetCore-Public
          ${{ else }}:
            ${{ if ${ .servicing } }}:
              name: netcore1espool-svc-internal
            ${{ else }}:
              name: netcore1espool-internal
          # Pool image/demands
          # https://helix.dot.net/#1esPools
          ${{ if parameters.ctx['Go1ESOfficial'] }}:
            image: 1es-windows-${{ ${ .distro } }}
            os: windows
          ${{ elseif ${ .public } }}:
            demands: ImageOverride -equals 1es-windows-${{ ${ .distro } }}-open
          ${{ else }}:
            demands: ImageOverride -equals 1es-windows-${{ ${ .distro } }}
            os: windows
